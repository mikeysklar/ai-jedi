<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" color="#1a1a1a" role="img" aria-label="AI JEDI and samArI crossing weapons">
  <defs>
    <style>
      .ink       { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin  { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .label     { font-family: Georgia, "Times New Roman", serif; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; fill: currentColor; }
    </style>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!--  AI JEDI (left)                                               -->
  <!-- ============================================================ -->
  <g transform="translate(170,212)">
    <!-- outer cloak drape, flared, behind the body -->
    <path class="ink" d="M -44,-34 Q -68,0 -76,64 L -52,66 Q -50,20 -42,-20"/>
    <path class="ink" d="M  44,-34 Q  68,0  76,64 L  52,66 Q  50,20  42,-20"/>

    <!-- hood: asymmetric, folded cowl with peaked crown -->
    <path class="ink" d="M -38,-44
                         C -50,-66 -46,-110 -18,-130
                         C 8,-134 30,-122 38,-96
                         C 42,-78 40,-58 36,-44
                         Q 18,-36 0,-36
                         Q -22,-36 -38,-44 Z"/>
    <!-- hood crown crease -->
    <path class="ink-thin" d="M -10,-128 Q -2,-122 2,-116"/>
    <!-- hood side folds (depth) -->
    <path class="ink-thin" d="M -32,-52 Q -38,-86 -22,-114"/>
    <path class="ink-thin" d="M -26,-46 Q -30,-74 -16,-100"/>
    <path class="ink-thin" d="M  30,-56 Q  36,-82  24,-108"/>
    <path class="ink-thin" d="M  24,-48 Q  28,-72  16,-96"/>

    <!-- face cavity shadow arc -->
    <path class="ink" d="M -22,-72 Q 0,-54 22,-72"/>
    <!-- eyes: shadowed brow + pupils -->
    <path class="ink-thin" d="M -11,-80 Q -8,-82 -5,-80"/>
    <path class="ink-thin" d="M  5,-80 Q  8,-82 11,-80"/>
    <path class="ink-thin" d="M -10,-76 L -6,-76"/>
    <path class="ink-thin" d="M  6,-76 L 10,-76"/>
    <!-- nose ridge -->
    <path class="ink-thin" d="M 0,-74 L 1,-62"/>
    <!-- mouth -->
    <path class="ink-thin" d="M -4,-56 Q 0,-53 4,-56"/>
    <!-- beard / chin shadow under the cowl -->
    <path class="ink-thin" d="M -14,-50 Q 0,-40 14,-50"/>
    <path class="ink-thin" d="M -10,-46 Q 0,-38 10,-46"/>

    <!-- robe body — curved, not boxy -->
    <path class="ink" d="M -36,-42
                         C -34,-20 -40,6 -46,62
                         L 46,62
                         C 40,6 34,-20 36,-42"/>
    <!-- V-collar / inner tunic -->
    <path class="ink" d="M -14,-44 L 0,-18 L 14,-44"/>
    <path class="ink-thin" d="M 0,-18 L -1,62"/>
    <!-- robe fold lines -->
    <path class="ink-thin" d="M -22,6 Q -24,30 -30,58"/>
    <path class="ink-thin" d="M  22,6 Q  24,30  30,58"/>

    <!-- wide obi sash -->
    <path class="ink" d="M -38,-4 Q 0,-1 38,-4"/>
    <path class="ink" d="M -38,5  Q 0,8  38,5"/>

    <!-- left sleeve: short hanging fabric -->
    <path class="ink" d="M -34,-38 C -48,-22 -50,-2 -44,18"/>
    <path class="ink-thin" d="M -30,-24 C -38,-10 -40,4 -36,16"/>

    <!-- right arm raised, shorter, reaches saber grip -->
    <path class="ink" d="M 30,-38 C 48,-56 66,-74 80,-90"/>
    <path class="ink" d="M 22,-30 C 40,-48 58,-66 74,-82"/>

    <text class="label" text-anchor="middle" x="0" y="94">AI JEDI</text>
  </g>

  <!-- ============================================================ -->
  <!--  samArI (right)                                               -->
  <!-- ============================================================ -->
  <g transform="translate(430,212)">
    <!-- head -->
    <path class="ink" d="M -16,-88
                         Q -20,-70 -14,-58
                         Q 0,-50 14,-58
                         Q 20,-70 16,-88
                         Q 12,-104 0,-106
                         Q -12,-104 -16,-88 Z"/>
    <!-- shaved pate line (sakayaki) -->
    <path class="ink-thin" d="M -12,-100 Q 0,-104 12,-100"/>
    <!-- chonmage (folded topknot) -->
    <path class="ink" d="M -3,-104 Q 4,-112 8,-106 Q 6,-100 -1,-102 Z"/>

    <!-- stern angled brows -->
    <path class="ink" d="M -13,-88 L -4,-86" stroke-width="1.8"/>
    <path class="ink" d="M  4,-86 L 13,-88" stroke-width="1.8"/>
    <!-- eyes: almond + pupils -->
    <path class="ink-thin" d="M -11,-80 Q -8,-82 -5,-80 Q -8,-78 -11,-80 Z"/>
    <path class="ink-thin" d="M  5,-80 Q  8,-82 11,-80 Q  8,-78  5,-80 Z"/>
    <circle cx="-8" cy="-80" r="0.9" fill="currentColor"/>
    <circle cx=" 8" cy="-80" r="0.9" fill="currentColor"/>
    <!-- nose ridge -->
    <path class="ink-thin" d="M 0,-76 L 1,-68"/>
    <!-- mouth (slight frown) -->
    <path class="ink-thin" d="M -5,-64 Q 0,-62 5,-64"/>
    <!-- jawline hint -->
    <path class="ink-thin" d="M -14,-68 Q -12,-60 -8,-56"/>
    <path class="ink-thin" d="M  14,-68 Q  12,-60  8,-56"/>

    <!-- kataginu: stiff winged shoulder piece -->
    <path class="ink" d="M -58,-46 L -42,-58 L -22,-50 L 0,-56 L 22,-50 L 42,-58 L 58,-46"/>
    <path class="ink-thin" d="M -42,-58 L -42,-46"/>
    <path class="ink-thin" d="M  42,-58 L  42,-46"/>

    <!-- kimono body flaring into hakama — curved -->
    <path class="ink" d="M -42,-46
                         C -38,-18 -46,10 -54,62
                         L 54,62
                         C 46,10 38,-18 42,-46"/>
    <!-- kimono V collar -->
    <path class="ink" d="M -16,-50 L 0,-26 L 16,-50"/>
    <!-- hakama pleats -->
    <path class="ink-thin" d="M -30,6 Q -34,30 -38,60"/>
    <path class="ink-thin" d="M -12,8 Q -14,32 -16,60"/>
    <path class="ink-thin" d="M  12,8 Q  14,32  16,60"/>
    <path class="ink-thin" d="M  30,6 Q  34,30  38,60"/>

    <!-- obi (wide belt) -->
    <path class="ink" d="M -46,-6 Q 0,-3 46,-6"/>
    <path class="ink" d="M -46, 3 Q 0, 6 46, 3"/>
    <path class="ink-thin" d="M -46,10 Q 0,12 46,10"/>

    <!-- saya (scabbard) tucked in obi on left hip -->
    <path class="ink" d="M -48,2 C -60,6 -68,14 -70,26"/>
    <path class="ink-thin" d="M -50,8 C -60,12 -66,18 -68,26"/>

    <!-- left arm raised (shorter) -->
    <path class="ink" d="M -30,-38 C -48,-56 -66,-74 -80,-90"/>
    <path class="ink" d="M -22,-30 C -40,-48 -58,-66 -74,-82"/>

    <!-- right arm hanging -->
    <path class="ink" d="M 30,-36 Q 44,-14 42,16"/>

    <text class="label" text-anchor="middle" x="0" y="94">samArI</text>
  </g>

  <!-- ============================================================ -->
  <!--  LIGHTSABER (held by AI JEDI)                                 -->
  <!--  Anchored at jedi's right hand (250, 122)                     -->
  <!--  Rotated -25° so blade extends upper-right                    -->
  <!-- ============================================================ -->
  <g transform="translate(250,122) rotate(-25)">
    <!-- blade outer glow halo -->
    <line x1="5" y1="0" x2="240" y2="0" stroke="#2a87ff" stroke-width="9" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
    <!-- blade solid blue -->
    <line x1="5" y1="0" x2="240" y2="0" stroke="#4ea3ff" stroke-width="5" stroke-linecap="round"/>
    <!-- blade inner white core -->
    <line x1="5" y1="0" x2="240" y2="0" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

    <!-- emitter shroud -->
    <rect x="-2" y="-5" width="7" height="10" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="1" y1="-5" x2="1" y2="5" stroke="#666" stroke-width="0.6"/>

    <!-- grip body -->
    <rect x="-30" y="-4.5" width="28" height="9" fill="#4a4a4a" stroke="#1a1a1a" stroke-width="1.4"/>
    <!-- grip ridges -->
    <line x1="-27" y1="-4.5" x2="-27" y2="4.5" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="-23" y1="-4.5" x2="-23" y2="4.5" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="-19" y1="-4.5" x2="-19" y2="4.5" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="-15" y1="-4.5" x2="-15" y2="4.5" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="-11" y1="-4.5" x2="-11" y2="4.5" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="-7"  y1="-4.5" x2="-7"  y2="4.5" stroke="#1a1a1a" stroke-width="0.7"/>
    <!-- activator button (red) -->
    <rect x="-20" y="-7" width="3" height="2" fill="#cc2222" stroke="#1a1a1a" stroke-width="0.6"/>

    <!-- pommel -->
    <rect x="-38" y="-5" width="8" height="10" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.4"/>
    <line x1="-34" y1="-5" x2="-34" y2="5" stroke="#666" stroke-width="0.6"/>

    <!-- hand grip wrap: fingers curling over the grip -->
    <path d="M -27,-4.5 Q -23,-10 -19,-4.5 Q -15,-10 -11,-4.5 Q -7,-10 -3,-4.5" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- thumb underneath -->
    <path d="M -22,4.5 Q -16,10 -10,4.5" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ============================================================ -->
  <!--  KATANA (held by samArI)                                      -->
  <!--  Anchored at samurai's left hand (350, 122)                   -->
  <!--  Rotated -155° so blade extends upper-left                    -->
  <!-- ============================================================ -->
  <g transform="translate(350,122) rotate(-155)">
    <!-- CURVED BLADE (sori) — slim arc with inked outline -->
    <!-- back of blade (mune) -->
    <path d="M 9,-2.5 Q 124,-16 238,-18" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- edge of blade (ha) -->
    <path d="M 9,2.5  Q 124,-10 238,-12" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- blade fill (silver) -->
    <path d="M 9,0 Q 124,-13 238,-15" fill="none" stroke="#e4e6ea" stroke-width="4" stroke-linecap="round"/>
    <!-- hamon (temper line along the edge) -->
    <path d="M 14,1.5 Q 124,-11 232,-13" fill="none" stroke="#b6b9bd" stroke-width="0.8" stroke-linecap="round" opacity="0.9"/>
    <!-- kissaki (blade tip) - slim chisel point -->
    <path d="M 238,-12 L 252,-22 L 238,-18 Z" fill="#e4e6ea" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- tsuba (oval guard) -->
    <ellipse cx="7" cy="0" rx="3.5" ry="9" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.4"/>
    <ellipse cx="7" cy="0" rx="1.6" ry="5" fill="none" stroke="#666" stroke-width="0.6"/>

    <!-- fuchi (collar) -->
    <rect x="0" y="-6" width="4" height="12" fill="#222" stroke="#1a1a1a" stroke-width="1.1"/>

    <!-- tsuka (handle) body -->
    <rect x="-30" y="-5" width="30" height="10" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- tsukamaki (ito wrap diagonal crisscross diamonds) -->
    <path d="M -30,-5 L -25,5  M -25,-5 L -30,5
             M -25,-5 L -20,5  M -20,-5 L -25,5
             M -20,-5 L -15,5  M -15,-5 L -20,5
             M -15,-5 L -10,5  M -10,-5 L -15,5
             M -10,-5 L -5,5   M -5,-5  L -10,5
             M -5,-5  L 0,5    M 0,-5   L -5,5"
          fill="none" stroke="#1a1a1a" stroke-width="0.75"/>
    <!-- menuki (ornament) -->
    <circle cx="-15" cy="0" r="1.8" fill="#b8860b" stroke="#1a1a1a" stroke-width="0.6"/>

    <!-- kashira (pommel cap) -->
    <rect x="-36" y="-5" width="6" height="10" fill="#222" stroke="#1a1a1a" stroke-width="1.4"/>

    <!-- hand grip wrap -->
    <path d="M -22,-5 Q -18,-10 -14,-5 Q -10,-10 -6,-5 Q -2,-10 2,-5" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- thumb underneath -->
    <path d="M -16,5 Q -10,10 -4,5" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
