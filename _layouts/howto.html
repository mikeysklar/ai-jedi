---
layout: default
---
<article class="howto">
  <header class="howto-header">
    <h1>{{ page.title }}</h1>
    {% if page.description %}
    <p class="howto-description">{{ page.description }}</p>
    {% endif %}
    {% if page.tags %}
    <div class="howto-tags">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="howto-content">
    {{ content }}
  </div>

  <footer class="howto-footer">
    <a href="{{ '/howtos/' | relative_url }}">&larr; All Howtos</a>
  </footer>
</article>
